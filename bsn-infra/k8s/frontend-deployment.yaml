apiVersion: apps/v1
kind: Deployment
metadata:
  name: bsn-frontend
  namespace: bsn
  labels:
    app: bsn-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bsn-frontend
  template:
    metadata:
      labels:
        app: bsn-frontend
    spec:
      containers:
        - name: bsn-frontend
          image: 825386256502.dkr.ecr.us-east-1.amazonaws.com/bsn-ui:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
