spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/book_social_network
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  application:
    security:
      jwt:
        secret-key: ${JWT_SECRET}
        expiration: ${JWT_EXPIRATION}
    mailing:
      frontend:
        activation-url: http://localhost:4200/activate-account
    file:
      upload:
        photos-output-path: ./uploads
    cors:
      allowed-origins:
        - http://localhost:4200   # Angular's default dev port

logging:
  level:
    com.nabgha.book: INFO
    org.springframework.web: INFO
    org.springframework.security: WARN
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx"