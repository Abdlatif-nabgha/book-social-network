<div class="flex items-center justify-center w-full h-full">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-100">
    
    <!-- Header -->
    <div class="px-8 pt-8 pb-6 text-center">
      <h2 class="text-2xl font-bold text-slate-900">Welcome back</h2>
      <p class="text-sm text-slate-500 mt-2">Please enter your details to sign in.</p>
    </div>

    <!-- Error Alert -->
    @if (errorMessage.length) {
      <div class="mx-8 mb-4 bg-red-50 border-l-4 border-red-500 p-4 rounded-r-md">
        <div class="flex">
          <div class="ml-3">
            <div class="text-sm text-red-700">
              <ul class="list-disc pl-5 space-y-1 font-medium">
                @for (message of errorMessage; track message) {
                  <li>{{ message }}</li>
                }
              </ul>
            </div>
          </div>
        </div>
      </div>
    }

    <!-- Login Form -->
    <div (keydown.enter)="login()" class="px-8 pb-8 space-y-5">
      <!-- Email Field -->
      <div>
        <label for="login" class="block text-sm font-medium text-slate-700 mb-1">Email address</label>
        <input 
          type="email" 
          [(ngModel)]="authRequest.email" 
          id="login" 
          name="email"
          placeholder="name@example.com"
          class="w-full px-4 py-2.5 bg-slate-50 rounded-lg border border-slate-200 focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all text-sm text-slate-900 placeholder:text-slate-400"
        >
      </div>

      <!-- Password Field -->
      <div>
        <label for="password" class="block text-sm font-medium text-slate-700 mb-1">Password</label>
        <div class="relative">
          <input 
            [type]="showPassword ? 'text' : 'password'" 
            [(ngModel)]="authRequest.password" 
            id="password" 
            name="password"
            placeholder="••••••••"
            class="w-full px-4 py-2.5 bg-slate-50 rounded-lg border border-slate-200 focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all text-sm text-slate-900 placeholder:text-slate-400 pr-10"
          >
          <button type="button" (click)="showPassword = !showPassword" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600 focus:outline-none">
            @if (!showPassword) {
              <!-- Eye Open -->
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              </svg>
            } @else {
              <!-- Eye Slash -->
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
              </svg>
            }
          </button>
        </div>
      </div>

      <!-- Extra Actions -->
      <div class="flex items-center justify-between mt-2">
        <div class="flex items-center">
          <input id="remember-me" name="remember-me" type="checkbox" class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-slate-300 rounded cursor-pointer">
          <label for="remember-me" class="ml-2 block text-sm text-slate-700 cursor-pointer">Remember me</label>
        </div>
        <div class="text-sm">
          <a href="#" class="font-medium text-blue-600 hover:text-blue-500 transition-colors">Forgot password?</a>
        </div>
      </div>

      <!-- Submit Button -->
      <div class="pt-2">
        <button 
          (click)="login()" 
          type="button"
          class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-all active:scale-[0.98]"
        >
          Sign in
        </button>
      </div>

      <!-- Register Link -->
      <div class="mt-6 text-center">
        <p class="text-sm text-slate-600">
          Don't have an account? 
          <button (click)="register()" type="button" class="font-medium text-blue-600 hover:text-blue-500 transition-colors ml-1">
            Register now
          </button>
        </p>
      </div>
    </div>
  </div>
</div>
