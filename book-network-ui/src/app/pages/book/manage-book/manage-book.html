<app-menu></app-menu>

<div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
  <!-- Header Section -->
  <div class="mb-8">
    <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Share a Book</h1>
    <p class="text-slate-500 text-sm mt-1">Fill in the details to add your book to the social network library.</p>
  </div>

  <!-- Error Alerts -->
  @if (errorMessage().length > 0) {
    <div class="mb-6 bg-red-50 border-l-4 border-red-500 p-4 rounded-r-xl">
      <div class="text-sm text-red-700 font-medium">
        <ul class="list-disc pl-5 space-y-1">
          @for (error of errorMessage(); track error) {
            <li>{{ error }}</li>
          }
        </ul>
      </div>
    </div>
  }

  <form (ngSubmit)="onSubmit()" class="bg-white rounded-2xl border border-slate-100 shadow-sm p-6 sm:p-8 space-y-6">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      
      <!-- Book Cover Image Upload -->
      <div class="md:col-span-1 flex flex-col items-center">
        <label class="block text-sm font-medium text-slate-700 mb-2 w-full text-left">Book Cover</label>
        
        <div class="relative w-full aspect-[3/4] bg-slate-50 border border-slate-200 rounded-xl overflow-hidden flex flex-col items-center justify-center text-slate-400 hover:bg-slate-100/50 hover:border-slate-300 transition-all group">
          @if (picturePreviewUrl()) {
            <img [src]="picturePreviewUrl()" class="w-full h-full object-cover" alt="Cover Preview">
          } @else {
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-8 h-8 text-slate-300 group-hover:scale-105 transition-all">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6.827 6.175A2.31 2.31 0 015.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 00-1.134-.175 2.31 2.31 0 01-1.64-1.055l-.822-1.316a2.192 2.192 0 00-1.736-1.039 48.774 48.774 0 00-5.232 0 2.192 2.192 0 00-1.736 1.039l-.821 1.316z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 12.75a4.5 4.5 0 11-9 0 4.5 4.5 0 019 0zM18.75 10.5h.008v.008h-.008V10.5z" />
            </svg>
            <span class="text-xs text-slate-500 font-medium mt-2">Upload Photo</span>
          }
          <input 
            type="file" 
            accept="image/*" 
            (change)="onFileSelected($event)" 
            class="absolute inset-0 opacity-0 cursor-pointer"
          >
        </div>
      </div>

      <!-- Form Inputs -->
      <div class="md:col-span-2 space-y-4">
        <!-- Title -->
        <div>
          <label for="title" class="block text-sm font-medium text-slate-700 mb-1">Title</label>
          <input 
            type="text" 
            id="title" 
            name="title" 
            [(ngModel)]="bookRequest.title" 
            required 
            placeholder="The Great Gatsby"
            class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all text-sm"
          >
        </div>

        <!-- Author -->
        <div>
          <label for="author" class="block text-sm font-medium text-slate-700 mb-1">Author</label>
          <input 
            type="text" 
            id="author" 
            name="author" 
            [(ngModel)]="bookRequest.author" 
            required 
            placeholder="F. Scott Fitzgerald"
            class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all text-sm"
          >
        </div>

        <!-- ISBN -->
        <div>
          <label for="isbn" class="block text-sm font-medium text-slate-700 mb-1">ISBN</label>
          <input 
            type="text" 
            id="isbn" 
            name="isbn" 
            [(ngModel)]="bookRequest.isbn" 
            required 
            placeholder="978-0743273565"
            class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all text-sm"
          >
        </div>

        <!-- Synopsis -->
        <div>
          <label for="synopsis" class="block text-sm font-medium text-slate-700 mb-1">Synopsis</label>
          <textarea 
            id="synopsis" 
            name="synopsis" 
            [(ngModel)]="bookRequest.synopsis" 
            required 
            rows="4" 
            placeholder="Provide a brief summary of the book..."
            class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all text-sm resize-none"
          ></textarea>
        </div>

        <!-- Shareable Toggle -->
        <div class="flex items-center gap-2.5 pt-2">
          <input 
            type="checkbox" 
            id="shareable" 
            name="shareable" 
            [(ngModel)]="bookRequest.shareable" 
            class="h-4.5 w-4.5 text-blue-600 focus:ring-blue-500 border-slate-300 rounded cursor-pointer"
          >
          <label for="shareable" class="text-sm font-medium text-slate-700 cursor-pointer select-none">
            Make this book shareable with other users
          </label>
        </div>
      </div>
    </div>

    <!-- Form Footer Action Buttons -->
    <div class="border-t border-slate-100 pt-6 flex items-center justify-end gap-3">
      <button 
        (click)="cancel()" 
        type="button" 
        class="px-4 py-2 border border-slate-200 hover:bg-slate-50 text-slate-700 text-sm font-medium rounded-xl active:scale-[0.98] transition-all cursor-pointer"
      >
        Cancel
      </button>
      <button 
        type="submit" 
        [disabled]="loading()" 
        class="inline-flex items-center gap-2 px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded-xl shadow-md shadow-blue-500/10 active:scale-[0.98] transition-all cursor-pointer disabled:opacity-60"
      >
        @if (loading()) {
          <svg class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
          </svg>
          Saving...
        } @else {
          Save Book
        }
      </button>
    </div>
  </form>
</div>
