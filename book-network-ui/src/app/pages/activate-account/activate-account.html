<div class="flex items-center justify-center w-full h-full min-h-screen py-10 relative">
  <!-- Toast Notification -->
  @if (showToast()) {
    <div class="toast-container bg-slate-900/95 backdrop-blur text-white px-5 py-3.5 rounded-2xl shadow-2xl border border-slate-800 animate-slide-in">
      <div class="flex items-center justify-center w-8 h-8 rounded-full bg-green-500/20 text-green-400 shrink-0">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
        </svg>
      </div>
      <div class="flex flex-col min-w-[200px]">
        <span class="text-sm font-semibold text-white">Success</span>
        <span class="text-xs text-slate-300 mt-0.5">{{ successMessage() }}</span>
      </div>
      <button (click)="showToast.set(false)" class="ml-4 text-slate-400 hover:text-white transition-colors cursor-pointer focus:outline-none">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
  }

  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-100">
    
    <!-- Header -->
    <div class="px-8 pt-8 pb-6 text-center">
      <h2 class="text-2xl font-bold text-slate-900">Activate Account</h2>
      <p class="text-sm text-slate-500 mt-2">Please enter the 6-character activation code sent to your email.</p>
    </div>

    <!-- Error Alert -->
    @if (errorMessage().length) {
      <div class="mx-8 mb-4 bg-red-50 border-l-4 border-red-500 p-4 rounded-r-md">
        <div class="flex">
          <div class="ml-3">
            <div class="text-sm text-red-700">
              <ul class="list-disc pl-5 space-y-1 font-medium">
                @for (message of errorMessage(); track message) {
                  <li>{{ message }}</li>
                }
              </ul>
            </div>
          </div>
        </div>
      </div>
    }

    <!-- Code Input Form -->
    <div (keydown.enter)="activateAccount()" class="px-8 pb-8 space-y-5">
      <div class="flex flex-col items-center justify-center">
        <label for="activationCode" class="block text-sm font-medium text-slate-700 mb-4 text-center">Verification Code</label>
        <code-input 
          [codeLength]="6" 
          (codeChanged)="onCodeChanged($event)" 
          (codeCompleted)="onCodeCompleted($event)">
        </code-input>
      </div>

      <!-- Submit Button -->
      <div class="pt-2">
        <button 
          (click)="activateAccount()" 
          type="button"
          [disabled]="loading()"
          aria-busy="{{loading()}}"
          class="w-full flex justify-center items-center gap-2 py-2.5 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-all active:scale-[0.98] disabled:opacity-60 cursor-pointer"
        >
          @if (loading()) {
            <!-- Simple spinner -->
            <svg class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
            </svg>
            Activating...
          } @else {
            Activate Account
          }
        </button>
      </div>

      <!-- Redirect Link -->
      <div class="mt-6 text-center">
        <p class="text-sm text-slate-600">
          Want to log in instead? 
          <button (click)="login()" type="button" class="font-medium text-blue-600 hover:text-blue-500 transition-colors ml-1 cursor-pointer">
            Sign in
          </button>
        </p>
      </div>
    </div>
  </div>
</div>
