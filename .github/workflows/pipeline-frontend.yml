name: BSN Frontend Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'book-network-ui/**'
      - 'docker/frontend/**'
      - 'compose.yaml'
      - '.github/workflows/*-frontend.yml'
  workflow_dispatch:

jobs:
  compile:
    name: Compile & Build Angular
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: book-network-ui/package-lock.json

      - name: Install Dependencies
        run: |
          cd book-network-ui
          npm ci --legacy-peer-deps

      - name: Build Frontend Application
        run: |
          cd book-network-ui
          npm run build -- --configuration production

  build-and-push-docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [compile]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Project Version from package.json
        id: extract_version
        run: |
          cd book-network-ui
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: book-network-ui
          file: docker/frontend/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/bsn-ui:${{ steps.extract_version.outputs.VERSION }}
            ${{ secrets.DOCKERHUB_USERNAME }}/bsn-ui:latest