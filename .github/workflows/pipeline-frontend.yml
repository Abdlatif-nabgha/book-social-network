name: BSN Frontend Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'book-network-ui/**'
      - 'docker/frontend/**'
      - 'compose.yaml'
      - '.github/workflows/*-frontend.yml'
  workflow_dispatch:

jobs:
  compile:
    name: Compile & Build Angular
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: book-network-ui/package-lock.json

      - name: Install Dependencies
        run: |
          cd book-network-ui
          npm ci --legacy-peer-deps

      - name: Build Frontend Application
        run: |
          cd book-network-ui
          npm run build -- --configuration production

  build-and-push-docker:
    name: Build & Push Docker Image to Amazon ECR
    runs-on: ubuntu-latest
    needs: [compile]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Project Version from package.json
        id: extract_version
        run: |
          cd book-network-ui
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image to Amazon ECR
        uses: docker/build-push-action@v6
        with:
          context: book-network-ui
          file: docker/frontend/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/bsn-ui:${{ steps.extract_version.outputs.VERSION }}
            ${{ steps.login-ecr.outputs.registry }}/bsn-ui:latest

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --region ${{ secrets.AWS_REGION }} --name bsn-cluster

      - name: Deploy to EKS (Rolling Update)
        run: |
          kubectl rollout restart deployment bsn-frontend -n bsn
          kubectl rollout status deployment bsn-frontend -n bsn --timeout=120s